# Per-client Postgres. DB name/user/password all derive from TENANT_SLUG so
# running multiple clients locally never produces an ambiguous "client" database.
# Docker compose reads .env automatically — set TENANT_SLUG and PG_PORT there before `up`.
name: ${TENANT_SLUG}
services:
  postgres:
    image: postgres:16-alpine
    container_name: ${TENANT_SLUG}_postgres
    environment:
      POSTGRES_USER: ${TENANT_SLUG}
      POSTGRES_PASSWORD: ${TENANT_SLUG}
      POSTGRES_DB: ${TENANT_SLUG}
    ports:
      - "${PG_PORT}:5432"
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TENANT_SLUG} -d ${TENANT_SLUG}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: ${TENANT_SLUG}_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "${STORAGE_PORT:-9000}:9000"
      - "${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  pg:
  minio:
